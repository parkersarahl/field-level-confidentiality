{% extends "base.html" %}
{% block body %}
<section class="panel narrow signin">
  <h1>Sign in to {{ company }} HR &amp; Payroll</h1>
  <form method="post" action="{{ url_for('login') }}">
    <label>Username
      <input name="username" value="{{ username or '' }}" autocomplete="username" autofocus required>
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button class="btn" type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
