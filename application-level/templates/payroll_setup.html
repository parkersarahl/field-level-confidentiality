{% extends "base.html" %}

{% block content %}

<h1>Complete Payroll Setup</h1>

<form>

    <div class="card">

        <label>Employee ID</label>
        <input type="number">


        <label>Salary</label>
        <input type="number">


        <label>Pay Frequency</label>

        <select>
            <option>Biweekly</option>
            <option>Monthly</option>
            <option>Weekly</option>
        </select>

    </div>


    <div class="card">

        <h2>Tax & Bank</h2>

        <label>SSN</label>
        <input type="text">


        <label>Bank Name</label>
        <input type="text">


        <label>Bank Account Number</label>
        <input type="text">

    </div>


    <button type="submit">
        Save Payroll Setup
    </button>

</form>

{% endblock %}
